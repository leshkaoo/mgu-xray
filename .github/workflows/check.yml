name: Local prototype checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned engine sources
        run: |
          git init research/upstream/XTLS--Xray-core
          git -C research/upstream/XTLS--Xray-core fetch --depth 1 https://github.com/XTLS/Xray-core.git 676eaf66f8f05d4d558ee7a74b4736623d3feeb9
          git -C research/upstream/XTLS--Xray-core checkout --detach FETCH_HEAD
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/test-package.py
      - run: sh scripts/build.sh
      - run: python3 scripts/e2e-local.py
      - run: python3 scripts/collect-notices.py
      - run: python3 scripts/package.py
